# Example configuration for wl-crosshair.
#
# Copy this file to one of these paths (the first one found is used):
#   - $WL_CROSSHAIR_CONFIG (explicit path)
#   - $XDG_CONFIG_HOME/wl-crosshair/config.toml
#   - ~/.config/wl-crosshair/config.toml
#
# All keys are optional. A CLI flag overrides the matching key for that run.
# Unknown keys are rejected, so a typo is reported instead of silently ignored.

# Path to the crosshair image (PNG, JPG, …). Transparency is supported.
# Fallback if not set here or on the command line:
#   1. environment variable WL_CROSSHAIR_IMAGE_PATH
#   2. ./cursors/inverse-v.png
image_path = "/home/user/.config/wl-crosshair/dot.png"

# Resize the image to size x size pixels. Leave out to keep the original size.
# size = 24

# Offset from the screen center in pixels.
# positive = right / down, negative = left / up. Default: 0
offset_x = 0
offset_y = 0

# The crosshair is centered automatically – screen_width / screen_height
# from older versions are no longer needed (still accepted, but ignored).
